name: Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin-src

      - name: Checkout vbwd-fe-user
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-fe-user
          path: vbwd-fe-user
          submodules: recursive

      - name: Overlay plugin source
        run: cp -r plugin-src/. vbwd-fe-user/plugins/cms/

      - name: Clone landing1 peer plugin
        # src/components/NativePricingPlans.vue imports the sibling
        # ../../../landing1/Landing1View.vue. fe-user gitignores every plugin
        # dir, so the checkout has none — clone the peer so the import resolves.
        run: |
          git clone --depth=1 \
            https://github.com/VBWD-platform/vbwd-fe-user-plugin-landing1.git \
            vbwd-fe-user/plugins/landing1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vbwd-fe-user/package-lock.json

      - name: Build vbwd-fe-core submodule
        run: |
          cd vbwd-fe-user/vbwd-fe-core
          npm install
          npm run build

      - name: Install dependencies
        run: |
          cd vbwd-fe-user
          npm install

      - name: Run plugin tests (Vitest unit/integration; Playwright e2e excluded)
        run: |
          cd vbwd-fe-user
          unit_test_files=$(find plugins/cms \( -name "*.spec.ts" -o -name "*.test.ts" \) -not -path "*/tests/e2e/*" 2>/dev/null)
          if [ -n "$unit_test_files" ]; then
            npx vitest run plugins/cms/tests/ --exclude='**/tests/e2e/**' --reporter=verbose
          else
            echo "No Vitest unit/integration tests found for cms — skipping (any e2e specs run by Playwright separately)."
          fi
